<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>mesh. chat</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0b0c0f;
      --surface:  #13151a;
      --surface2: #1a1d24;
      --border:   #1f2229;
      --accent:   #00e5a0;
      --accent2:  #004d36;
      --muted:    #4a5060;
      --text:     #d4d8e2;
      --dim:      #6b7385;
      --danger:   #ff4d6d;
      --mono:     'JetBrains Mono', monospace;
      --sans:     'Syne', sans-serif;
    }
    html, body { height:100%; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:14px; }
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:.4;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }

    .screen { display:none; width:100%; height:100%; }
    .screen.active { display:flex; }

    /* ── JOIN ── */
    #join-screen { flex-direction:column; align-items:center; justify-content:center; overflow-y:auto; padding:30px 0; min-height:100vh; }
    .join-card { width:100%; max-width:400px; padding:0 24px; animation:fadeUp .45s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }

    .logo-btn {
      font-family:var(--sans); font-size:2.4rem; font-weight:800; letter-spacing:-1px;
      color:var(--accent); margin-bottom:4px; display:block;
    }
    .tagline-btn {
      background:none; border:none; cursor:pointer; text-align:left; padding:0; display:block;
      font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:.14em;
      text-transform:uppercase; margin-bottom:34px; transition:color .15s;
    }
    .tagline-btn:hover { color:var(--accent); }

    .field { margin-bottom:16px; }
    .field-label { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:7px; display:flex; align-items:center; gap:8px; }
    .badge-lock { font-size:9px; padding:2px 7px; border-radius:10px; letter-spacing:.06em; background:rgba(255,77,109,.1); color:var(--danger); border:1px solid rgba(255,77,109,.2); }

    input[type="text"] {
      width:100%; background:var(--surface); border:1px solid var(--border); border-radius:6px;
      color:var(--text); font-family:var(--mono); font-size:14px; padding:11px 14px;
      outline:none; transition:border-color .2s, box-shadow .2s;
    }
    input[type="text"]:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,229,160,.08); }
    input[type="text"]::placeholder { color:var(--muted); }
    input[type="text"]:disabled { opacity:.5; cursor:not-allowed; }

    .join-btn {
      width:100%; margin-top:8px; padding:13px;
      background:var(--accent); color:#000;
      font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.06em;
      border:none; border-radius:6px; cursor:pointer; transition:opacity .15s, transform .12s;
    }
    .join-btn:hover { opacity:.85; transform:translateY(-1px); }
    .join-btn:active { transform:translateY(0); opacity:.7; }

    /* Recent */
    .recent-section { margin-top:28px; }
    .recent-title { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
    .recent-list { display:flex; flex-direction:column; gap:6px; }
    .recent-item {
      display:flex; align-items:center; justify-content:space-between;
      background:var(--surface); border:1px solid var(--border); border-radius:8px;
      padding:10px 14px; cursor:pointer; transition:border-color .15s, background .15s;
    }
    .recent-item:hover { border-color:var(--accent); background:var(--surface2); }
    .recent-room { font-size:13px; color:var(--text); }
    .recent-room span { color:var(--accent); }
    .recent-preview { font-size:11px; color:var(--dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
    .recent-time { font-size:10px; color:var(--muted); flex-shrink:0; margin-left:10px; }
    .recent-left { min-width:0; }
    .no-recent { font-size:11px; color:var(--muted); font-style:italic; }

    /* ── CHAT ── */
    #chat-screen { flex-direction:column; height:100dvh; overflow:hidden; }
    .chat-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:13px 20px; border-bottom:1px solid var(--border);
      background:var(--surface); flex-shrink:0;
    }
    .room-info { display:flex; flex-direction:column; gap:2px; }
    .room-name { font-family:var(--sans); font-weight:700; font-size:15px; }
    .room-name span { color:var(--accent); }
    .room-meta { font-size:10px; color:var(--dim); letter-spacing:.08em; }
    .header-actions { display:flex; gap:8px; align-items:center; }
    .pill-btn {
      font-family:var(--mono); font-size:11px; padding:5px 12px; border-radius:20px;
      border:1px solid var(--border); background:transparent; color:var(--muted);
      cursor:pointer; transition:all .15s; letter-spacing:.05em;
    }
    .pill-btn:hover { border-color:var(--accent); color:var(--accent); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px var(--accent); animation:blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    #messages {
      flex:1; overflow-y:auto; padding:18px 20px 10px;
      display:flex; flex-direction:column; gap:3px; scroll-behavior:smooth;
    }
    #messages::-webkit-scrollbar { width:4px; }
    #messages::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    .msg { display:flex; flex-direction:column; max-width:75%; animation:msgIn .2s ease both; }
    @keyframes msgIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    .msg.mine { align-self:flex-end; align-items:flex-end; }
    .msg.theirs { align-self:flex-start; align-items:flex-start; }
    .msg-meta { font-size:10px; color:var(--dim); margin-bottom:3px; letter-spacing:.04em; }
    .msg.mine .msg-meta { color:rgba(0,229,160,.5); }
    .msg-bubble { padding:9px 13px; border-radius:12px; line-height:1.55; font-size:13.5px; word-break:break-word; }
    .msg.mine .msg-bubble { background:var(--accent2); border:1px solid rgba(0,229,160,.2); color:#c8ffe8; border-bottom-right-radius:3px; }
    .msg.theirs .msg-bubble { background:var(--surface); border:1px solid var(--border); color:var(--text); border-bottom-left-radius:3px; }

    .chat-footer { padding:12px 20px; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; }
    .input-row { display:flex; gap:10px; align-items:center; }
    #msg-input {
      flex:1; background:var(--bg); border:1px solid var(--border); border-radius:8px;
      padding:11px 14px; color:var(--text); font-family:var(--mono); font-size:13.5px;
      outline:none; transition:border-color .2s;
    }
    #msg-input:focus { border-color:var(--accent); }
    #msg-input::placeholder { color:var(--muted); }
    .send-btn {
      width:42px; height:42px; border-radius:8px; background:var(--accent); border:none;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:opacity .15s, transform .12s;
    }
    .send-btn:hover { opacity:.85; transform:scale(1.05); }
    .send-btn:active { transform:scale(.97); }
    .send-btn svg { width:17px; height:17px; }
    .char-info { font-size:10px; color:var(--dim); margin-top:6px; }

    /* status bar */
    .status-bar {
      font-size:10px; padding:5px 20px; background:rgba(0,229,160,.06);
      color:var(--accent); border-bottom:1px solid rgba(0,229,160,.1);
      letter-spacing:.06em; flex-shrink:0; display:none;
    }
    .status-bar.show { display:block; }

    /* ── MODALS ── */
    .modal-bg {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.75);
      backdrop-filter:blur(5px); z-index:500; align-items:center; justify-content:center;
    }
    .modal-bg.open { display:flex; }
    .modal {
      background:var(--surface); border:1px solid var(--border); border-radius:14px;
      padding:28px 24px; width:280px; animation:fadeUp .3s ease both;
      display:flex; flex-direction:column; align-items:center; gap:18px;
    }
    .modal-title { font-family:var(--sans); font-size:1rem; font-weight:700; color:var(--text); }
    .modal-sub { font-size:11px; color:var(--dim); text-align:center; line-height:1.65; margin-top:-10px; }
    .code-display { display:flex; gap:10px; }
    .code-dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--border); transition:all .15s; }
    .code-dot.filled { background:var(--accent); border-color:var(--accent); }
    .code-dot.error  { background:var(--danger);  border-color:var(--danger); }
    .keypad { display:grid; grid-template-columns:repeat(3, 1fr); gap:9px; width:100%; }
    .key {
      background:var(--surface2); border:1px solid var(--border); border-radius:10px;
      color:var(--text); font-family:var(--mono); font-size:18px; font-weight:600;
      padding:14px 0; text-align:center; cursor:pointer; transition:background .12s, transform .1s;
      user-select:none;
    }
    .key:hover { background:var(--border); }
    .key:active { transform:scale(.93); }
    .key.zero { grid-column:2; }
    .key.del { font-size:14px; color:var(--muted); }
    .key.del:hover { color:var(--danger); border-color:rgba(255,77,109,.3); }
    .modal-cancel { font-size:11px; color:var(--muted); cursor:pointer; letter-spacing:.06em; text-transform:uppercase; transition:color .15s; }
    .modal-cancel:hover { color:var(--danger); }
    .new-name-row { display:flex; gap:10px; width:100%; }
    .new-name-row input { flex:1; }
    .confirm-btn {
      padding:11px 16px; background:var(--accent); color:#000;
      font-family:var(--mono); font-size:12px; font-weight:700;
      border:none; border-radius:6px; cursor:pointer; white-space:nowrap; transition:opacity .15s;
    }
    .confirm-btn:hover { opacity:.85; }

    .toast {
      position:fixed; bottom:80px; left:50%;
      transform:translateX(-50%) translateY(10px);
      background:var(--surface); border:1px solid var(--border);
      color:var(--accent); font-size:12px; padding:8px 16px; border-radius:20px;
      opacity:0; transition:all .25s; pointer-events:none; white-space:nowrap; z-index:600;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    @media(max-width:500px) {
      .msg { max-width:88%; }
      .chat-header, .chat-footer { padding:11px 14px; }
      #messages { padding:14px 14px 8px; }
    }
  </style>
</head>
<body>

<!-- JOIN -->
<div id="join-screen" class="screen active">
  <div class="join-card">
    <div class="logo-btn">mesh.</div>
    <button class="tagline-btn" onclick="openKeypad()">P2P · No servers · GitHub Pages ready</button>

    <div class="field">
      <div class="field-label">
        Your name
        <span class="badge-lock" id="lock-badge" style="display:none">locked</span>
      </div>
      <input type="text" id="username-input" placeholder="e.g. alex" maxlength="24" autocomplete="off" spellcheck="false"/>
    </div>

    <div class="field">
      <div class="field-label">Room name</div>
      <input type="text" id="room-input" placeholder="e.g. general" maxlength="32" autocomplete="off" spellcheck="false"/>
    </div>

    <button class="join-btn" id="join-btn" onclick="joinRoom()">join room →</button>

    <div class="recent-section">
      <div class="recent-title">recent chats</div>
      <div class="recent-list" id="recent-list"><div class="no-recent">no recent chats yet</div></div>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen" class="screen">
  <div class="chat-header">
    <div class="room-info">
      <div class="room-name"><span id="header-room">#room</span></div>
      <div class="room-meta" id="header-meta">connecting…</div>
    </div>
    <div class="header-actions">
      <div class="dot"></div>
      <button class="pill-btn" onclick="copyRoomLink()">share</button>
      <button class="pill-btn" onclick="leaveRoom()">leave</button>
    </div>
  </div>
  <div class="status-bar" id="status-bar">⟳ syncing with peers…</div>
  <div id="messages"></div>
  <div class="chat-footer">
    <div class="input-row">
      <input type="text" id="msg-input" placeholder="type a message…" maxlength="500" autocomplete="off" spellcheck="false"/>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="char-info" id="char-info">enter to send</div>
  </div>
</div>

<!-- KEYPAD MODAL -->
<div class="modal-bg" id="keypad-modal">
  <div class="modal">
    <div class="modal-title">mesh. settings</div>
    <div class="modal-sub">enter your 4-digit code<br/>to unlock username change</div>
    <div class="code-display">
      <div class="code-dot" id="d0"></div>
      <div class="code-dot" id="d1"></div>
      <div class="code-dot" id="d2"></div>
      <div class="code-dot" id="d3"></div>
    </div>
    <div class="keypad">
      <div class="key" onclick="keyPress('1')">1</div>
      <div class="key" onclick="keyPress('2')">2</div>
      <div class="key" onclick="keyPress('3')">3</div>
      <div class="key" onclick="keyPress('4')">4</div>
      <div class="key" onclick="keyPress('5')">5</div>
      <div class="key" onclick="keyPress('6')">6</div>
      <div class="key" onclick="keyPress('7')">7</div>
      <div class="key" onclick="keyPress('8')">8</div>
      <div class="key" onclick="keyPress('9')">9</div>
      <div class="key zero" onclick="keyPress('0')">0</div>
      <div class="key del"  onclick="keyDel()">⌫</div>
    </div>
    <div class="modal-cancel" onclick="closeKeypad()">cancel</div>
  </div>
</div>

<!-- NAME MODAL -->
<div class="modal-bg" id="name-modal">
  <div class="modal">
    <div class="modal-title">change username</div>
    <div class="modal-sub">enter your new display name</div>
    <div class="new-name-row">
      <input type="text" id="new-name-input" placeholder="new name…" maxlength="24" autocomplete="off" spellcheck="false"/>
      <button class="confirm-btn" onclick="confirmNewName()">save</button>
    </div>
    <div class="modal-cancel" onclick="closeNameModal()">cancel</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────
let gun, roomRef, myName, myRoom;
let seenKeys  = new Set();
let codeEntry = '';
const SECRET  = '2012';

// Only use the most reliable public Gun peers
const GUN_PEERS = ['https://peer.wallie.io/gun'];

// ── BOOT ───────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  try { loadUsername(); } catch(e) { console.warn('localStorage unavailable', e); }
  try { renderRecentChats(); } catch(e) {}

  const r = new URLSearchParams(window.location.search).get('room');
  if (r) {
    document.getElementById('room-input').value = r;
    const u = document.getElementById('username-input');
    setTimeout(() => (u.disabled || u.value ? joinRoom() : u.focus()), 200);
  }
});

// ── USERNAME LOCK ──────────────────────────────────────────────────
function loadUsername() {
  const saved = localStorage.getItem('mesh_username');
  if (!saved) return;
  const u = document.getElementById('username-input');
  u.value    = saved;
  u.disabled = true;
  document.getElementById('lock-badge').style.display = '';
}

// ── JOIN ROOM ──────────────────────────────────────────────────────
function joinRoom() {
  const uEl  = document.getElementById('username-input');
  const rEl  = document.getElementById('room-input');
  const name = uEl.value.trim();
  const room = rEl.value.trim().toLowerCase().replace(/\s+/g, '-');

  if (!name) { shake('username-input'); showToast('enter a username first'); return; }
  if (!room) { shake('room-input');     showToast('enter a room name first'); return; }

  // Lock name on first use
  if (!uEl.disabled) {
    uEl.disabled = true;
    document.getElementById('lock-badge').style.display = '';
    try { localStorage.setItem('mesh_username', name); } catch(e) {}
  }

  myName = name;
  myRoom = room;
  seenKeys.clear();

  // ── Switch screen FIRST so user sees something immediately ──
  document.getElementById('header-room').textContent = '#' + myRoom;
  document.getElementById('header-meta').textContent = 'you — ' + myName;
  document.getElementById('messages').innerHTML = '';
  showScreen('chat-screen');

  try {
    const url = new URL(window.location.href);
    url.searchParams.set('room', myRoom);
    window.history.replaceState({}, '', url);
  } catch(e) {}

  // ── Init Gun after screen switch ──
  try {
    gun     = Gun({ peers: GUN_PEERS, localStorage: false, radisk: false });
    roomRef = gun.get('mesh-v2').get(myRoom);
    listenMessages();

    const sb = document.getElementById('status-bar');
    sb.classList.add('show');
    setTimeout(() => sb.classList.remove('show'), 3000);
  } catch(e) {
    console.error('Gun init failed:', e);
    showToast('peer connection failed — messages may be local only');
  }

  setTimeout(() => document.getElementById('msg-input').focus(), 100);
  try { saveRecent(myRoom, ''); } catch(e) {}
}

// ── GUN LISTENER ──────────────────────────────────────────────────
function listenMessages() {
  if (!roomRef) return;
  roomRef.map().on((data, key) => {
    try {
      if (!data || !data.text || !data.user) return;
      if (seenKeys.has(key)) return;
      seenKeys.add(key);
      appendMessage(data);
      try { saveRecent(myRoom, String(data.text).slice(0, 60)); } catch(e) {}
    } catch(e) { console.warn('message render error', e); }
  });
}

// ── SEND ──────────────────────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text  = input.value.trim();
  if (!text) return;

  const key = Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const msg  = { user: myName, text: text, time: Date.now() };

  // Render own message immediately — don't wait for Gun
  seenKeys.add(key);
  appendMessage(msg);
  try { saveRecent(myRoom, text.slice(0, 60)); } catch(e) {}

  // Push to peers
  try {
    if (roomRef) roomRef.get(key).put(msg);
  } catch(e) { console.warn('Gun put failed', e); }

  input.value = '';
  input.focus();
  updateCharInfo('');
}

// ── RENDER MESSAGE ────────────────────────────────────────────────
function appendMessage(data) {
  const isMine = data.user === myName;
  const time   = data.time
    ? new Date(data.time).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })
    : '';
  const wrap   = document.createElement('div');
  wrap.className = 'msg ' + (isMine ? 'mine' : 'theirs');
  wrap.innerHTML =
    '<div class="msg-meta">' + (isMine ? 'you' : escHtml(data.user)) + ' · ' + time + '</div>' +
    '<div class="msg-bubble">' + escHtml(data.text) + '</div>';
  const c = document.getElementById('messages');
  c.appendChild(wrap);
  c.scrollTop = c.scrollHeight;
}

// ── LEAVE ─────────────────────────────────────────────────────────
function leaveRoom() {
  try { if (gun) gun.off(); } catch(e) {}
  gun = null; roomRef = null; seenKeys.clear();
  document.getElementById('messages').innerHTML = '';
  try {
    const url = new URL(window.location.href);
    url.searchParams.delete('room');
    window.history.replaceState({}, '', url);
  } catch(e) {}
  try { renderRecentChats(); } catch(e) {}
  showScreen('join-screen');
}

// ── COPY LINK ─────────────────────────────────────────────────────
function copyRoomLink() {
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('room', myRoom);
    navigator.clipboard.writeText(url.toString()).then(() => showToast('room link copied ✓'));
  } catch(e) { showToast('could not copy link'); }
}

// ── KEYPAD ────────────────────────────────────────────────────────
function openKeypad() { codeEntry = ''; updateDots(); document.getElementById('keypad-modal').classList.add('open'); }
function closeKeypad() { codeEntry = ''; updateDots(); document.getElementById('keypad-modal').classList.remove('open'); }
function keyPress(d) {
  if (codeEntry.length >= 4) return;
  codeEntry += d; updateDots();
  if (codeEntry.length === 4) setTimeout(checkCode, 150);
}
function keyDel() { codeEntry = codeEntry.slice(0, -1); updateDots(); }
function updateDots(err) {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('d' + i);
    dot.className = 'code-dot' + (err ? ' error' : i < codeEntry.length ? ' filled' : '');
  }
}
function checkCode() {
  if (codeEntry === SECRET) { closeKeypad(); openNameModal(); }
  else { updateDots(true); setTimeout(() => { codeEntry = ''; updateDots(); }, 750); }
}

// ── NAME MODAL ────────────────────────────────────────────────────
function openNameModal() {
  try { document.getElementById('new-name-input').value = localStorage.getItem('mesh_username') || ''; } catch(e) {}
  document.getElementById('name-modal').classList.add('open');
  setTimeout(() => document.getElementById('new-name-input').focus(), 80);
}
function closeNameModal() { document.getElementById('name-modal').classList.remove('open'); }
function confirmNewName() {
  const val = document.getElementById('new-name-input').value.trim();
  if (!val) { shake('new-name-input'); return; }
  myName = val;
  try { localStorage.setItem('mesh_username', val); } catch(e) {}
  const u = document.getElementById('username-input');
  u.value = val; u.disabled = true;
  document.getElementById('lock-badge').style.display = '';
  closeNameModal();
  showToast('username saved: ' + val + ' ✓');
}

// ── RECENT CHATS ──────────────────────────────────────────────────
function getRecent() {
  try { return JSON.parse(localStorage.getItem('mesh_recent') || '[]'); } catch { return []; }
}
function saveRecent(room, lastMsg) {
  let list = getRecent().filter(r => r.room !== room);
  list.unshift({ room, lastMsg: lastMsg || '', time: Date.now() });
  try { localStorage.setItem('mesh_recent', JSON.stringify(list.slice(0, 6))); } catch(e) {}
}
function renderRecentChats() {
  const list = getRecent();
  const el   = document.getElementById('recent-list');
  if (!list.length) { el.innerHTML = '<div class="no-recent">no recent chats yet</div>'; return; }
  el.innerHTML = list.map(r => {
    const safeRoom = r.room.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return '<div class="recent-item" onclick="quickJoin(\'' + safeRoom + '\')">' +
      '<div class="recent-left">' +
        '<div class="recent-room"><span>#</span>' + escHtml(r.room) + '</div>' +
        (r.lastMsg ? '<div class="recent-preview">' + escHtml(r.lastMsg) + '</div>' : '') +
      '</div>' +
      '<div class="recent-time">' + timeAgo(r.time) + '</div>' +
    '</div>';
  }).join('');
}
function quickJoin(room) {
  document.getElementById('room-input').value = room;
  const u = document.getElementById('username-input');
  if (!u.disabled && !u.value) u.focus(); else joinRoom();
}
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60)    return 'just now';
  if (s < 3600)  return Math.floor(s/60)  + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

// ── KEYBOARD ──────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeKeypad(); closeNameModal(); return; }
  if (e.key !== 'Enter') return;
  if (document.getElementById('name-modal').classList.contains('open'))    { confirmNewName(); return; }
  if (document.getElementById('chat-screen').classList.contains('active')) { sendMessage();    return; }
  if (document.getElementById('join-screen').classList.contains('active')) { joinRoom(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'msg-input') updateCharInfo(e.target.value);
});
function updateCharInfo(val) {
  const el = document.getElementById('char-info');
  if (val.length > 400) {
    el.textContent = (500 - val.length) + ' chars left';
    el.style.color = val.length > 480 ? 'var(--danger)' : '';
  } else {
    el.textContent = 'enter to send';
    el.style.color = '';
  }
}

// ── HELPERS ───────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function shake(id) {
  const el = document.getElementById(id);
  el.style.borderColor = 'var(--danger)';
  el.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(-3px)'},{transform:'translateX(3px)'},{transform:'translateX(0)'}], {duration:280});
  setTimeout(() => el.style.borderColor = '', 900);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
